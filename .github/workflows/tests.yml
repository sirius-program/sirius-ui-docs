name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: sirius-ui-docs

env:
  APP_ENV: testing
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  DB_CONNECTION: sqlite
  DB_DATABASE: ${{ github.workspace }}/sirius-ui-docs/database/database.sqlite
  COMPOSER_PROCESS_TIMEOUT: '0'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: sirius-ui-docs

      - name: Install Aspell
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y aspell aspell-en

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Resolve locked package revision
        id: package
        run: |
          php -r '$lock = json_decode(file_get_contents("composer.lock"), true, flags: JSON_THROW_ON_ERROR); foreach ($lock["packages"] as $package) { if ($package["name"] === "sirius/ui") { echo "reference=" . $package["dist"]["reference"] . PHP_EOL; exit; } } throw new RuntimeException("Package missing from lock file");' >> "$GITHUB_OUTPUT"

      - name: Checkout package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sirius-program/sirius-ui
          ref: ${{ steps.package.outputs.reference }}
          path: sirius-ui
          persist-credentials: false

      - name: Build package assets
        working-directory: sirius-ui
        run: |
          npm ci
          npm run build

      - name: Setup Application
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          touch database/database.sqlite
          php artisan migrate --force --no-interaction
          npm ci
          npm run build

      - name: Validate metadata and audit dependencies
        run: |
          composer validate
          composer audit
          npm audit
          npm --prefix ../sirius-ui audit

      - name: Run CI Checks
        run: composer ci:check

  browser:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: sirius-ui-docs

      - name: Install Aspell
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y aspell aspell-en

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Resolve locked package revision
        id: package
        run: |
          php -r '$lock = json_decode(file_get_contents("composer.lock"), true, flags: JSON_THROW_ON_ERROR); foreach ($lock["packages"] as $package) { if ($package["name"] === "sirius/ui") { echo "reference=" . $package["dist"]["reference"] . PHP_EOL; exit; } } throw new RuntimeException("Package missing from lock file");' >> "$GITHUB_OUTPUT"

      - name: Checkout package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sirius-program/sirius-ui
          ref: ${{ steps.package.outputs.reference }}
          path: sirius-ui
          persist-credentials: false

      - name: Build package assets
        working-directory: sirius-ui
        run: |
          npm ci
          npm run build

      - name: Setup Application
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          touch database/database.sqlite
          php artisan migrate --force --no-interaction
          npm ci
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Browser Tests
        run: composer test:browser
